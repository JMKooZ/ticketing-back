spring:
  application:
    name: ticketing-back
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://localhost:3307/ticketing?serverTimezone=Asia/Seoul
    username: root
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # 아직 엔티티가 없으므로 스키마를 건드리지 않음

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true